name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          # Create binaries directory
          New-Item -ItemType Directory -Force -Path converter/src-tauri/binaries

          # Download FFmpeg
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          
          # Extract
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp
          
          # Find and move ffmpeg.exe
          $ffmpegPath = Get-ChildItem -Path ffmpeg_temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegPath.FullName -Destination "converter/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          
          # Verify
          if (Test-Path "converter/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe") {
            Write-Host "FFmpeg binary setup complete."
          } else {
            Write-Error "Failed to setup FFmpeg binary."
          }

      - name: install frontend dependencies
        working-directory: converter
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'converter'
          tagName: ${{ github.ref_name }}
          releaseName: 'FastVideo Converter v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
