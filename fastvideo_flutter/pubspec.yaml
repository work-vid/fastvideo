name: fastvideo_flutter
description: "A Flutter plugin for playing high-res videos efficiently on Android."
version: 0.0.1
homepage:

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  permission_handler: ^12.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.vidhanth.fastvideo.fastvideo_flutter
        pluginClass: FastVideoPlayerPlugin
